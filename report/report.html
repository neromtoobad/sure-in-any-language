<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sure in Any Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @page { size: Letter; margin: 0.85in 1in 0.85in 1in; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Old Standard TT", Georgia, "Times New Roman", serif; font-size: 10.3pt; line-height: 1.3; color: #000; margin: 0; }
  h1.title { font-size: 20pt; font-weight: 700; text-align: center; margin: 0 0 8pt; line-height: 1.12; }
  .authors { text-align: center; font-size: 11pt; margin: 0 0 4pt; }
  .with { text-align: center; font-size: 11pt; margin: 6pt 0 10pt; }
  .abs-h { text-align: center; font-size: 14pt; font-weight: 700; margin: 8pt 0 4pt; }
  .abstract { margin: 0 0.45in 8pt; text-align: justify; font-size: 10.3pt; }
  h2 { font-size: 13.5pt; font-weight: 700; margin: 11pt 0 4pt; break-after: avoid; }
  h3 { font-size: 11pt; font-weight: 700; margin: 8pt 0 2pt; break-after: avoid; }
  p { margin: 0 0 6pt; text-align: justify; orphans: 2; widows: 2; }
  ol, ul { margin: 0 0 6pt; padding-left: 18pt; }
  li { margin-bottom: 2pt; }
  a { color: #1155cc; text-decoration: none; }
  figure { margin: 6pt 0 7pt; break-inside: avoid; text-align: center; }
  figure img { max-width: 100%; }
  figcaption, .cap { font-size: 9pt; line-height: 1.25; text-align: left; margin-top: 3pt; color: #222; }
  table.data { border-collapse: collapse; width: 100%; font-size: 8.4pt; line-height: 1.2; margin: 4pt 0 3pt; font-family: Arial, Helvetica, sans-serif; }
  table.data th { border-bottom: 0.8pt solid #000; border-top: 0.8pt solid #000; padding: 2.5pt 0 2.5pt 8pt; text-align: right; font-weight: 700; vertical-align: bottom; }
  table.data td { padding: 1.6pt 0 1.6pt 8pt; text-align: right; font-variant-numeric: tabular-nums; }
  table.data td:nth-child(n+2), table.data th:nth-child(n+2) { white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; padding-left: 8pt; width: 100%; }
  table.data th:last-child, table.data td:last-child { padding-right: 2pt; }
  table.data tr.grp td { font-weight: 700; text-align: left; padding: 4pt 0 1pt 0; white-space: normal; width: auto; }
  table.data tr.grp + tr.grp td, table.data tr + tr.grp td { border-top: 0.4pt solid #999; }
  table.data tr:nth-child(2).grp td { border-top: none; }
  table.data tr:last-child td { border-bottom: 0.8pt solid #000; padding-bottom: 3pt; }
  .tbl { break-inside: avoid; margin: 6pt 0 8pt; }
  .tbl.long { break-inside: auto; }
  .tbl.long .cap { break-after: avoid; }
  table.data tr { break-inside: avoid; }
  table.data tr.grp { break-after: avoid; }
  code, .mono { font-family: Menlo, Consolas, monospace; font-size: 8.6pt; }
  pre { font-family: Menlo, Consolas, monospace; font-size: 8pt; line-height: 1.25; background: #f5f5f3; padding: 6pt 8pt; white-space: pre-wrap; margin: 4pt 0 8pt; break-inside: avoid; }
  .fn { font-size: 8.5pt; text-align: center; margin: 0 0 8pt; color: #222; }
  .refs li { font-size: 9.3pt; margin-bottom: 3pt; text-align: left; }
  .pagebreak { break-before: page; }
  sup { font-size: 7pt; }
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
